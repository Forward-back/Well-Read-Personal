# 兜底模板
# 固定回复模板直接作为回复；模型兜底模板在 fallback_strategy = "model" 时交给模型生成。
templates:
  # --- 固定回复模板 ---
  - id: "default_fallback"
    name: "标准兜底"
    description: "友好告知无法回答并提供建议"
    default: true
    content: |
      抱歉，我没有在知识库中找到与你的问题直接相关的内容。

      你可以尝试：
      1. 换一种方式重新表述问题
      2. 补充更具体的信息
      3. 检查其他参考资料

      如果还有其他问题，我很乐意继续帮忙。

      ## 语言规则
      - 始终使用简体中文回答

  - id: "polite_fallback"
    name: "礼貌兜底"
    description: "更加礼貌详细的无法回答提示"
    content: |
      抱歉，我目前无法准确回答你的问题。可能原因：
      - 问题超出了当前资料范围
      - 知识库中尚未包含相关内容

      建议：
      1. 换用不同关键词重新提问
      2. 把问题拆成更具体的子问题
      3. 确认相关资料是否已导入知识库

      感谢理解，也欢迎继续提问其他内容。

      ## 语言规则
      - 始终使用简体中文回答

  - id: "brief_fallback"
    name: "简洁兜底"
    description: "简短的无法回答提示"
    content: "抱歉，我暂时无法回答这个问题。请换一种表述，或确认相关资料是否已在知识库中。"

  # --- 模型兜底提示模板（fallback_strategy = "model"） ---
  - id: "model_fallback"
    name: "模型兜底提示"
    description: "引导模型基于已有资料或通用知识回答的提示词"
    mode: "model"
    content: |
      没有检索到与用户问题直接匹配的内容。知识库中包含以下文档：

      {{kb_documents}}

      重要说明：
      1. 若上方文档列表可用，可据此帮助回答（例如列出相关文档、提示哪些文档可能包含所需信息）
      2. 若文档列表为空，可使用通用知识回答，并明确告知用户答案不来自知识库
      3. 若问题涉及特定领域或需要最新信息，建议用户查阅官方资料
      4. 保持回答准确、客观

      ## 语言规则
      - 始终使用简体中文回答

      用户问题：{{query}}

  - id: "default_fallback_prompt"
    name: "标准兜底 Prompt"
    description: "知识库无相关结果时引导模型回答的默认提示词"
    mode: "model"
    content: |
      你是 WellRead Personal，服务单一用户的阅读与知识管理助手。

      没有检索到与用户问题直接匹配的内容。知识库中包含以下文档：

      {{kb_documents}}

      ## 回答要求
      - 若上方文档列表可用，可据此帮助回答（例如列出相关文档、提示哪些文档可能包含所需信息，或概括知识库现有内容）
      - 若文档列表为空或与问题无关，可基于通用知识回答，并明确告知用户答案不来自知识库
      - 回答简洁、清楚、有实质内容
      - 涉及实时数据或个人隐私信息时，如实说明无法获取
      - 语气清楚、友好
      - 始终使用简体中文回答

      ## 用户问题：
      {{query}}
