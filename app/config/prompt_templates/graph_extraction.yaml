# 图谱抽取提示词模板
# 用于知识图谱的实体与关系抽取
templates:
  - id: "default_extract_entities"
    name: "实体抽取"
    description: "从文本中抽取实体，用于构建知识图谱"
    default: true
    content: |
      ## 任务
      从用户提供的文本中抽取所有符合以下实体类型的实体：
      EntityTypes: [Person, Organization, Location, Product, Event, Date, Work, Concept, Resource, Category, Operation]

      ## 要求
      1. 输出必须是 JSON 数组格式
      2. 每个实体必须包含 title 与 type 字段；description 字段可选但强烈建议提供
      3. type 字段值必须严格从 EntityTypes 列表中选择，不得创建新类型
      4. 无法确定实体类型时不要强行分类，宁可不抽取该实体
      5. 不要输出任何解释或额外内容，只输出 JSON 数组
      6. 所有字段值不得包含 HTML 标签或其他代码
      7. 实体存在歧义时，在 description 中说明指代
      8. 没有找到实体时返回空数组 []

      ## 实体抽取规则
      - Person：真实或虚构人物，包括历史人物、现代人物、文学角色等
      - Organization：公司、政府机构、团队、学校等组织实体
      - Location：地理位置、地标、国家、城市等
      - Product：商品、服务、品牌等商业产品
      - Event：事件、会议、节日、历史事件等
      - Date：日期、时间段、时代等时间信息
      - Work：书籍、电影、音乐、艺术作品等创作成果
      - Concept：抽象概念、思想、理论等
      - Resource：自然资源、信息资源、工具等
      - Category：分类、类别、领域等
      - Operation：操作、动作、方法、流程等

      ## 抽取步骤
      1. 仔细阅读文本，识别潜在实体
      2. 为每个实体确定最合适的类型（必须来自 EntityTypes）
      3. 为每个实体创建 JSON 对象，包含字段：
         - title：实体标准名称，不带引号等修饰
         - type：从 EntityTypes 中选择的实体类型
         - description：基于文本内容的简要描述，使用简体中文
      4. 检查每个实体的字段是否正确、格式是否规范
      5. 把所有实体对象合并为一个 JSON 数组
      6. 检查最终 JSON 是否有效并满足要求

      ## 语言规则
      - 实体 title 按源文本原样保留
      - description 使用简体中文

      ## 示例
      [输入]
      文本：“罗密欧与朱丽叶”是威廉·莎士比亚早期创作的一部悲剧，讲述两个来自世仇家族的意大利青年相爱。它是莎士比亚生前最受欢迎的剧作之一，也是演出最频繁的剧作之一。故事发生在意大利维罗纳。两位主角罗密欧·蒙太古与朱丽叶·凯普莱特不顾家族仇恨深深相爱。

      [输出]
      [
        {
          "title": "罗密欧与朱丽叶",
          "type": "Work",
          "description": "威廉·莎士比亚创作的悲剧，讲述两个世仇家族青年相爱的故事"
        },
        {
          "title": "威廉·莎士比亚",
          "type": "Person",
          "description": "《罗密欧与朱丽叶》的作者，在创作早期写下该剧"
        },
        {
          "title": "罗密欧·蒙太古",
          "type": "Person",
          "description": "《罗密欧与朱丽叶》两位主角之一，来自蒙太古家族"
        },
        {
          "title": "朱丽叶·凯普莱特",
          "type": "Person",
          "description": "《罗密欧与朱丽叶》两位主角之一，来自凯普莱特家族"
        },
        {
          "title": "维罗纳",
          "type": "Location",
          "description": "《罗密欧与朱丽叶》故事发生的意大利城市"
        },
        {
          "title": "蒙太古",
          "type": "Organization",
          "description": "剧中两个世仇家族之一，罗密欧的家族"
        },
        {
          "title": "凯普莱特",
          "type": "Organization",
          "description": "剧中两个世仇家族之一，朱丽叶的家族"
        }
      ]

  - id: "default_extract_relationships"
    name: "关系抽取"
    description: "抽取实体之间的关系，用于构建知识图谱"
    default: true
    content: |
      ## 任务
      从用户提供的实体数组中抽取实体之间明确存在的关系，形成结构化关系网络。

      ## 要求
      1. 关系抽取必须基于提供的文本内容，不得编造不存在的关系
      2. 输出必须是 JSON 数组格式，每个关系为数组中的一个对象
      3. 每个关系对象必须包含 source、target、description、strength 字段
      4. 不要输出任何解释或额外内容，只输出 JSON 数组
      5. 没有找到关系时返回空数组 []

      ## 关系抽取规则
      - 只抽取文本中明确存在的关系
      - source 与 target 必须是实体数组中已有的实体
      - 关系描述应简洁说明两个实体之间的具体关系
      - 关系强度按以下标准判断：
        * 10：直接创作/从属关系（如作者与作品、发明人与发明、母公司与子公司）
        * 9：同一实体的不同表现（如别名、曾用名）
        * 8：紧密相关且相互影响（如密切合作者、家庭成员）
        * 7：明确但间接的关系（如作品中的角色、组织成员）
        * 6：有明确联系的间接关联（如同事关系、同类产品）
        * 5：相关但联系较弱（如同一领域的不同概念）

      ## 抽取步骤
      1. 仔细分析文本内容，判断哪些实体之间存在明确关系
      2. 只考虑文本中明确提到的关系，不得编造
      3. 为每个关系确定：
         - source：源实体 title（必须是实体列表中已有的实体）
         - target：目标实体 title（必须是实体列表中已有的实体）
         - description：简洁准确的关系描述（简体中文）
         - strength：按上述标准给出的关系强度（5-10 的整数）
      4. 检查关系是否双向：
         - 双向关系（如“A 是 B 的朋友”意味着“B 也是 A 的朋友”）可考虑创建反向关系
         - 单向关系（如“A 创作了 B”）只保留单向关系
      5. 核对所有关系的一致性与合理性：
         - 不得存在矛盾关系（如 A 同时是 B 的父亲和兄弟）
         - 关系描述应与关系强度匹配
      6. 把所有有效关系组织为 JSON 数组

      ## 语言规则
      - 关系描述使用简体中文

      ## 示例
      [输入]
      实体：[省略，同实体抽取示例]

      文本：“罗密欧与朱丽叶”是威廉·莎士比亚早期创作的一部悲剧，讲述两个来自世仇家族的意大利青年相爱。它是莎士比亚生前最受欢迎的剧作之一，也是演出最频繁的剧作之一。故事发生在意大利维罗纳。两位主角罗密欧·蒙太古与朱丽叶·凯普莱特不顾家族仇恨深深相爱。

      [输出]
      [
        {
          "source": "威廉·莎士比亚",
          "target": "罗密欧与朱丽叶",
          "description": "威廉·莎士比亚是《罗密欧与朱丽叶》的作者",
          "strength": 10
        },
        {
          "source": "罗密欧·蒙太古",
          "target": "朱丽叶·凯普莱特",
          "description": "罗密欧与朱丽叶不顾家族仇恨深深相爱",
          "strength": 8
        },
        {
          "source": "罗密欧·蒙太古",
          "target": "蒙太古",
          "description": "罗密欧是蒙太古家族成员",
          "strength": 8
        },
        {
          "source": "朱丽叶·凯普莱特",
          "target": "凯普莱特",
          "description": "朱丽叶是凯普莱特家族成员",
          "strength": 8
        },
        {
          "source": "罗密欧与朱丽叶",
          "target": "罗密欧·蒙太古",
          "description": "罗密欧·蒙太古是剧中主角之一",
          "strength": 7
        },
        {
          "source": "罗密欧与朱丽叶",
          "target": "朱丽叶·凯普莱特",
          "description": "朱丽叶·凯普莱特是剧中主角之一",
          "strength": 7
        },
        {
          "source": "罗密欧与朱丽叶",
          "target": "维罗纳",
          "description": "故事发生在意大利维罗纳",
          "strength": 6
        },
        {
          "source": "蒙太古",
          "target": "凯普莱特",
          "description": "蒙太古与凯普莱特两个家族存在世仇",
          "strength": 8
        }
      ]
