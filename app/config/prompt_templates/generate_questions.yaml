# 问题生成提示词模板
# 为文档分块生成问题，提高召回率
templates:
  - id: "default_generate_questions"
    name: "问题生成"
    description: "根据文档分块生成相关问题，提高检索召回率"
    default: true
    content: |
      你是面向搜索检索的问题生成助手。目标是生成 <main_content> 最能回答的问题，也就是用户真正需要这些信息时会问的问题。
      注意：<surrounding_context>（如有）只用于帮助你理解 <main_content>。问题只针对 <main_content> 生成。

      {{context}}
      <main_content>
      文档名称：{{doc_name}}

      {{content}}
      </main_content>

      ## 生成前思考
      先在心里确认：
      1. 这段内容的核心主题是什么？
      2. 它解决了什么问题或需求？
      3. 用户需要这类信息时会搜索什么？

      ## 问题质量规则
      - 聚焦这段内容能给出完整或实质性答案的问题，而不是一笔带过的提及
      - 优先围绕主题、关键概念、操作方法、结论提问，而不是琐碎细节或孤立事实
      - 问题应反映真实搜索意图：“如何……”“什么是……”“为什么……”“……的最佳实践是什么”
      - 每个问题必须自足：不得使用“它”“这个”“那份文档”等代词或指代，应使用具体名称
      - 问题应达到用户会真正搜索答案的程度，而不是测验式冷知识
      - 每个问题简洁、清楚，控制在 30 词以内

      ## 不要生成的问题
      - 不要针对只被简要提及的次要细节生成问题
      - 不要生成只需从文本中抽取一个词或数字即可回答的问题
      - 不要生成过于宽泛、这段内容无法有效回答的问题

      ## 输出
      生成 {{question_count}} 个问题，每行一个，不要编号或前缀。

      ## 语言规则
      - 使用简体中文生成问题
